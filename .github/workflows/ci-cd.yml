name: CI and deploy (backend)

# Every push and pull request is built and tested. A push to main (or a manual run) then deploys.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Tests that need no database or LiveKit. The integration tests (CpIntegrationTests, the
      # context and chat tests) need a real database, so they stay out of the pipeline.
      - name: Test
        run: ./mvnw -B -ntp -Dtest='!CpIntegrationTests,!PanchayatBackendApplicationTests,!ChatRequestTests' -Dsurefire.failIfNoSpecifiedTests=false test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # One deploy at a time; a second push waits instead of overlapping
    concurrency:
      group: production-deploy-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build the jar
        run: ./mvnw -B -ntp -DskipTests package

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload and deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          SERVICE: ${{ vars.BACKEND_SERVICE }}
          JAR_PATH: ${{ vars.BACKEND_JAR_PATH || '/opt/panchayat-deploy/backend/app.jar' }}
          BACKEND_PORT: ${{ vars.BACKEND_PORT || '8082' }}
          DB_NAME: ${{ vars.BACKEND_DB_NAME || 'panchayat_db' }}
        run: |
          set -euo pipefail
          [ -n "$SERVICE" ] || { echo "Set the repository variable BACKEND_SERVICE (the systemd service name)."; exit 1; }
          SSH="ssh -i $HOME/.ssh/deploy_key -p $PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          JAR=target/panchayat-backend-0.0.1-SNAPSHOT.jar
          SHA=$(sha256sum "$JAR" | cut -d' ' -f1)
          REMOTE_TMP="/tmp/panchayat-deploy-$GITHUB_RUN_ID"
          $SSH "$USER_NAME@$HOST" "mkdir -p $REMOTE_TMP"
          scp -i "$HOME/.ssh/deploy_key" -P "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$JAR" deploy/remote-deploy-backend.sh "$USER_NAME@$HOST:$REMOTE_TMP/"
          $SSH "$USER_NAME@$HOST" \
            "SERVICE='$SERVICE' JAR_PATH='$JAR_PATH' BACKEND_PORT='$BACKEND_PORT' DB_NAME='$DB_NAME' \
             NEW_JAR='$REMOTE_TMP/panchayat-backend-0.0.1-SNAPSHOT.jar' NEW_SHA='$SHA' COMMIT='$GITHUB_SHA' \
             bash $REMOTE_TMP/remote-deploy-backend.sh; rc=\$?; rm -rf $REMOTE_TMP; exit \$rc"
