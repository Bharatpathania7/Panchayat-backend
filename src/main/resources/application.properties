spring.application.name=panchayat-backend

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/panchayat_db
spring.datasource.username=postgres
spring.datasource.password=bharat@786
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# Flyway Database Migrations
spring.flyway.enabled=true

# Server Configuration
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000

# Email SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# SMTP timeouts
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.oauth.google.client-id=${GOOGLE_CLIENT_ID}
# Bootstrap Admin Accounts
app.bootstrap.super-admin-password=Bharat@12345678
app.bootstrap.admin-password=admin@12345678
app.bootstrap.moderator-password=admin@12345678
# Product asset upload configuration
app.upload.directory=uploads

# Multipart upload limits
spring.servlet.multipart.max-file-size=45MB
spring.servlet.multipart.max-request-size=50MB
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
livekit.url=${LIVEKIT_URL}
livekit.api-key=${LIVEKIT_API_KEY}
livekit.api-secret=${LIVEKIT_API_SECRET}

# Chat message encryption
app.chat.encryption-key-base64=${APP_CHAT_ENCRYPTION_KEY_BASE64}
app.chat.encryption-key-version=${APP_CHAT_ENCRYPTION_KEY_VERSION:1}

# Private personal-chat media storage
app.chat.media-storage-path=${CHAT_MEDIA_STORAGE_PATH:./private-chat-media}

# Maximum image size: 5 MB
app.chat.max-image-size-bytes=${CHAT_MAX_IMAGE_SIZE_BYTES:5242880}
logging.level.org.springframework.security=DEBUG
# PayU configuration
# PayU Configuration
payu.merchant-key=${PAYU_MERCHANT_KEY}
payu.merchant-salt=${PAYU_MERCHANT_SALT}

payu.payment-url=${PAYU_PAYMENT_URL:https://api.payu.in/v2/payments}
payu.verify-payment-url=${PAYU_VERIFY_PAYMENT_URL:https://info.payu.in/v3/transaction}
payu.environment=${PAYU_ENVIRONMENT:production}

payu.frontend-url=${FRONTEND_URL:http://localhost:3000}
payu.backend-url=${BACKEND_URL:http://localhost:8080}

