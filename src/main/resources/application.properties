spring.application.name=panchayat-backend

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/panchayat_db
spring.datasource.username=postgres
spring.datasource.password=bharat@786
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway Database Migrations
spring.flyway.enabled=true

# Server Configuration
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000

# Email SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# SMTP timeouts
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.oauth.google.client-id=${GOOGLE_CLIENT_ID}
# Bootstrap Admin Accounts
app.bootstrap.super-admin-password=Bharat@12345678
app.bootstrap.admin-password=admin@12345678
app.bootstrap.moderator-password=admin@12345678
# Product asset upload configuration
app.upload.directory=uploads

# Multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}